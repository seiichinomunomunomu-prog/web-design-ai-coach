<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>WEB Design AI Coach</title>
    <link href="/static/css/style.css" rel="stylesheet" media="screen">
</head>

<body>
    <nav class="mode-switch">
        <a href="/" class="mode-switch-button active">
            Review Mode
        </a>

        <a href="/create" class="mode-switch-button">
            Create Mode
        </a>
    </nav>
    <h1>WEB Design AI Coach</h1>
    <p>
        <a href="/logout">ログアウト</a>
    </p>
    <form method="post" action="/review" id="reviewForm">

        <h3>HTMLコード</h3>

        <textarea
            id="htmlCode"
            name="html_code"
            rows="10"
            cols="80"
            placeholder="HTMLコードを入力してください"
        >{{ html_code | default("") }}</textarea>

        <br><br>

        <h3>CSSコード</h3>

        <textarea
            id="cssCode"
            name="css_code"
            rows="10"x   
            cols="80"
            placeholder="CSSコードを入力してください"
        >{{ css_code | default("") }}</textarea>

        <br><br>
        <h3>JavaScriptコード</h3>

        <textarea
            id="jsCode"
            name="js_code"
            rows="10"
            cols="80"
            placeholder="JavaScriptコードを入力してください"
        >{{ js_code | default("") }}</textarea>

        <br><br>
        <h3>質問・相談内容</h3>

        <input
            type="text"
            name="question"
            size="80"
            placeholder="質問を入力してください"
            value="{{ question | default('') }}"
        >

        <br><br>

        <div class="review-action">
            <button type="submit" id="reviewButton">AI添削ボタン</button>
            <span id="loadingIndicator" class="loading-indicator"></span>
            <button type="button" id="clearCodeButton">
                コードをクリア
            </button>

        </div>
    </form>

    {% if answer_html %}
        <hr>

        <section class="result">
            <h2>AI添削結果</h2>

            <div class="answer">
                {{ answer_html | safe }}
            </div>
        </section>
        {% endif %}

    <script>
        const reviewForm = document.getElementById("reviewForm");
        const reviewButton = document.getElementById("reviewButton");
        const clearCodeButton = document.getElementById("clearCodeButton");

        const htmlCode = document.getElementById("htmlCode");
        const cssCode = document.getElementById("cssCode");
        const jsCode = document.getElementById("jsCode");

        const loadingIndicator = document.getElementById("loadingIndicator");

        reviewForm.addEventListener("submit", () => {
            reviewButton.disabled = true;
            clearCodeButton.disabled = true;

            reviewButton.textContent = "AI添削中...";
            loadingIndicator.classList.add("is-active");
        });

        clearCodeButton.addEventListener("click", () => {
            htmlCode.value = "";
            cssCode.value = "";
            jsCode.value = "";
        });
    </script>

</body>
</html>
