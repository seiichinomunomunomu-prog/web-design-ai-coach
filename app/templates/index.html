<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>WEB Design AI Coach</title>
    <link href="/static/css/style.css" rel="stylesheet" media="screen">
</head>

<body>

    <h1>WEB Design AI Coach</h1>
    <p>
        <a href="/logout">ログアウト</a>
    </p>
    <form method="post" action="/review">

        <h3>HTMLコード</h3>

        <textarea
            name="html_code"
            rows="10"
            cols="80"
            placeholder="HTMLコードを入力してください"
        >{{ html_code | default("") }}</textarea>

        <br><br>

        <h3>CSSコード</h3>

        <textarea
            name="css_code"
            rows="10"
            cols="80"
            placeholder="CSSコードを入力してください"
        >{{ css_code | default("") }}</textarea>

        <br><br>
        <h3>JavaScriptコード</h3>

        <textarea
            name="js_code"
            rows="10"
            cols="80"
            placeholder="JavaScriptコードを入力してください"
        >{{ js_code | default("") }}</textarea>

        <br><br>
        <h3>質問・相談内容</h3>

        <input
            type="text"
            name="question"
            size="80"
            placeholder="質問を入力してください"
            value="{{ question | default('') }}"
        >

        <br><br>

        <button type="submit">AI添削ボタン</button>

    </form>

    {% if answer_html %}
        <hr>

        <section class="result">
            <h2>AI添削結果</h2>

            <div class="answer">
                {{ answer_html | safe }}
            </div>
        </section>
    {% endif %}

</body>
</html>
